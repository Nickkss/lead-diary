services:
  app:
    build: .
    image: lead-diary:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - ld_data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"

  # HTTPS in front of the app. Used when ports 80/443 are free on the server (install.sh decides).
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  ld_data:
  caddy_data:
  caddy_config:
